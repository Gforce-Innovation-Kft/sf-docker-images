---
# sf-ci — build, test, and prove the result still works as a container job.
#
# This image is what the Salesforce pipelines run in, so it carries the E2E
# gate as well. See image-sf-devcontainer.yml for the one-workflow-per-image
# rationale.
#
# image (build -> test)          reusable-docker-image-build.yml
#   -> publish-candidate         throwaway GHCR tag, so it can be pulled
#     -> e2e-container           tier 1: a REAL container job on the candidate
#       -> e2e-workflows         tier 2: real downstream pipelines against it
#         -> cleanup             always, deletes the throwaway tag
#
# Both E2E tiers are blocking: if a critical workflow breaks in the new
# container, this PR goes red. Tier 1 gates tier 2 so a container that cannot
# even run `sf` fails in about a minute instead of spending a package-version
# create from a limited daily pool.
name: sf-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - 'sf-ci/**'
      - 'tests/test_sf_ci.py'
      - 'tests/requirements.txt'
      - '.github/workflows/image-sf-ci.yml'
      - '.github/workflows/reusable-docker-image-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: sf-ci
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
      # The reusable workflow's push job declares id-token: write for cosign.
      # A called workflow cannot request more than the caller grants, so this
      # must be here even though pull requests never reach that job.
      id-token: write
    uses: ./.github/workflows/reusable-docker-image-build.yml
    with:
      image-name: sf-ci
      context: ./sf-ci
      push: false
    secrets:
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish the candidate to a throwaway GHCR tag.
  #
  # Everything below needs to *pull* the image: a container job takes a registry
  # reference, not a loaded docker image, and the downstream repo has no access
  # to this run's artifacts. Deleted again by the cleanup job.
  # ---------------------------------------------------------------------------
  publish-candidate:
    name: Publish candidate to GHCR
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      # Registry references must be lowercase and the org name is not, and
      # workflow expressions have no lowercase function.
      - name: Resolve the GHCR reference
        id: ref
        run: |
          set -euo pipefail
          tag="pr-${{ github.event.pull_request.number || github.run_id }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sf-ci-e2e:${tag}" >> "$GITHUB_OUTPUT"

      # No rebuild: this is the exact artifact the test job validated.
      # Rebuilding could produce different bits and prove the wrong image.
      - name: Download the image built by this run
        uses: actions/download-artifact@v8
        with:
          name: sf-ci-image

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load, retag and push
        run: |
          set -euo pipefail
          docker load < sf-ci.tar.gz
          docker tag sf-ci:test "${{ steps.ref.outputs.ref }}"
          docker push "${{ steps.ref.outputs.ref }}"

      # The downstream repo pulls with its own token, so the package must be
      # readable from outside this repo. Visibility can only be set once the
      # package exists, which is why this follows the push.
      - name: Make the candidate package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X PATCH "orgs/${{ github.repository_owner }}/packages/container/sf-ci-e2e" \
            -f visibility=public \
            || echo "::warning::Could not set package visibility; the downstream pull may fail."

  # ---------------------------------------------------------------------------
  # Tier 1 — a real GitHub Actions container job on the candidate.
  #
  # The suite in tests/ asserts the image is internally correct, but it runs
  # `docker run`, so it cannot see what GitHub does to a container job:
  # bind-mounting /github/home and the file-command dir owned by the runner's
  # UID. Every regression this image has actually shipped lived in that gap —
  # which is why this runs unprivileged, as the runner's own UID.
  #
  # No secrets and no Salesforce org, so it costs nothing and can gate tier 2.
  # ---------------------------------------------------------------------------
  e2e-container:
    name: E2E tier 1 — container probes
    needs: publish-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.publish-candidate.outputs.ref }}
      options: --user 1001
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out files
        uses: actions/checkout@v7

      - name: Runner file-command paths are writable
        run: |
          set -euo pipefail
          # If these fail, every `uses:` step breaks in a way that looks like
          # the action's fault rather than the image's.
          echo "probe=ok" >> "$GITHUB_OUTPUT"
          echo "PROBE=ok" >> "$GITHUB_ENV"
          echo "tier 1 probe" >> "$GITHUB_STEP_SUMMARY"
          echo "file-command paths OK"

      - name: Running unprivileged as the runner UID
        run: |
          set -euo pipefail
          id
          [ "$(id -u)" != "0" ] || { echo "::error::container is running as root"; exit 1; }
          [ "$(id -u)" = "1001" ] || { echo "::error::expected UID 1001, got $(id -u)"; exit 1; }

      - name: HOME is usable
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          mkdir -p "$HOME/.sf"
          touch "$HOME/.sf/probe"

      - name: Salesforce CLI and plugins resolve
        run: |
          set -euo pipefail
          sf version
          sf plugins | tee plugins.txt
          grep -q sfdx-git-delta plugins.txt \
            || { echo "::error::sfdx-git-delta missing from the candidate image"; exit 1; }

      # Exercises the code path behind the sf-source-delta composite action
      # without needing an org or any secret.
      - name: sfdx-git-delta runs against a real repo
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          git config --global --add safe.directory '*'
          git init -q "$probe"
          cd "$probe"
          git config user.email ci@example.com
          git config user.name CI
          mkdir -p force-app/main/default/classes
          echo 'public class A {}' > force-app/main/default/classes/A.cls
          git add -A && git commit -qm first
          echo 'public class B {}' > force-app/main/default/classes/B.cls
          git add -A && git commit -qm second
          sf sgd source delta --to HEAD --from HEAD~1 --output-dir .
          echo "sfdx-git-delta OK"

  # ---------------------------------------------------------------------------
  # Tier 2 — run the real critical pipelines against the candidate image.
  #
  # Add a critical workflow by adding a matrix entry. Nothing else changes.
  #
  # Quota-light by construction: run-validate false spends no scratch org, and
  # skip-validation draws on the 500/day pool rather than the 6/day validated
  # pool. Each run still creates one package version.
  # ---------------------------------------------------------------------------
  e2e-workflows:
    name: E2E tier 2 — ${{ matrix.target.name }}
    needs: [publish-candidate, e2e-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: sf-package-release
            repo: Gforce-Innovation-Kft/sf-develop-demo
            workflow: weather2gp-release.yml
            # Pinned to the feature branch until weather2gp-release.yml is on
            # sf-develop-demo's default branch; drop the pin once it merges.
            ref: feature/weather2gp-release-flow
            inputs: >-
              -f run-validate=false
              -f skip-validation=true
              -f create-github-release=false
    steps:
      - name: Dispatch ${{ matrix.target.workflow }} and wait
        id: dispatch
        env:
          # GITHUB_TOKEN cannot dispatch workflows in another repository.
          GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          CANDIDATE: ${{ needs.publish-candidate.outputs.ref }}
          TARGET_REPO: ${{ matrix.target.repo }}
          TARGET_WORKFLOW: ${{ matrix.target.workflow }}
          TARGET_REF: ${{ matrix.target.ref }}
          TARGET_INPUTS: ${{ matrix.target.inputs }}
          E2E_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target.name }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::E2E_DISPATCH_TOKEN is not set. It needs actions:write on ${TARGET_REPO}."
            exit 1
          fi

          # Word splitting is intended — TARGET_INPUTS is a list of -f flags.
          # shellcheck disable=SC2086
          gh workflow run "$TARGET_WORKFLOW" \
            --repo "$TARGET_REPO" \
            --ref "$TARGET_REF" \
            -f "container-image=${CANDIDATE}" \
            -f container-user=1001 \
            -f "e2e-run-id=${E2E_ID}" \
            $TARGET_INPUTS

          # Correlate on the id echoed into the downstream run-name. Taking the
          # most recent run races whenever two PRs are in flight.
          echo "Waiting for the dispatched run to appear..."
          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id=$(gh run list --repo "$TARGET_REPO" \
              --workflow "$TARGET_WORKFLOW" --limit 30 \
              --json databaseId,displayTitle \
              --jq "[.[] | select(.displayTitle | contains(\"${E2E_ID}\"))][0].databaseId // empty")
            [ -n "$run_id" ] && break
          done

          if [ -z "$run_id" ]; then
            echo "::error::Dispatched run never appeared for id ${E2E_ID}."
            exit 1
          fi

          url="${GITHUB_SERVER_URL}/${TARGET_REPO}/actions/runs/${run_id}"
          echo "run-url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Downstream run: $url"

          # --exit-status makes a failed downstream run fail this job, which is
          # the entire point of the gate.
          gh run watch "$run_id" --repo "$TARGET_REPO" --exit-status

      - name: Summarise
        if: always()
        env:
          CANDIDATE: ${{ needs.publish-candidate.outputs.ref }}
        run: |
          {
            echo "## E2E — ${{ matrix.target.name }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image under test | \`${CANDIDATE}\` |"
            echo "| Container user | \`1001\` (unprivileged) |"
            echo "| Downstream | \`${{ matrix.target.workflow }}\` in \`${{ matrix.target.repo }}\` |"
            echo "| Downstream run | ${{ steps.dispatch.outputs.run-url || 'not started' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The throwaway tag must not outlive the test, or GHCR fills with pr-N tags.
  # Separate job so it runs whichever tier failed.
  # ---------------------------------------------------------------------------
  cleanup:
    name: Delete the candidate image
    needs: [publish-candidate, e2e-container, e2e-workflows]
    if: always() && needs.publish-candidate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete the throwaway GHCR tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          version_id=$(gh api --paginate \
            "orgs/${{ github.repository_owner }}/packages/container/sf-ci-e2e/versions" \
            --jq "[.[] | select(.metadata.container.tags[]? == \"${TAG}\")][0].id // empty" \
            2>/dev/null || true)
          if [ -n "$version_id" ]; then
            gh api -X DELETE \
              "orgs/${{ github.repository_owner }}/packages/container/sf-ci-e2e/versions/${version_id}"
            echo "::notice::Deleted the ${TAG} candidate image"
          else
            echo "::warning::Could not resolve ${TAG} for deletion; clean it up manually."
          fi
